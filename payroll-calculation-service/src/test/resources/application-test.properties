# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Kafka
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
kafka.topics.payroll-calculated=payroll-calculated

# Clients
client.internal.url=http://localhost:8088

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/payroll-service

# OAuth2 Client
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8080/realms/payroll-service/protocol/openid-connect/token
spring.security.oauth2.client.registration.keycloak-client.provider=keycloak
spring.security.oauth2.client.registration.keycloak-client.client-id=payroll-service
spring.security.oauth2.client.registration.keycloak-client.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak-client.scope=openid

# Config
spring.cloud.config.enabled=false